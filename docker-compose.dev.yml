# Docker Compose для разработки - только PostgreSQL
# Приложение запускается локально через IDE или ./mvnw spring-boot:run

services:
  db:
    image: postgres:16-alpine
    container_name: coffeeshop-db
    environment:
      POSTGRES_DB: coffeeshop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coffeeshop_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
