# =============================================================================
# Test Configuration
# =============================================================================

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Disable Thymeleaf caching for tests
spring.thymeleaf.cache=false

# Logging - reduce noise during tests
logging.level.org.example.coffeeshop=WARN
logging.level.org.springframework.security=WARN

# Admin credentials for tests
admin.username=test-admin
admin.password=test-pass

# File upload settings
file.upload-dir=target/uploads-test
app.upload.allowed-content-types=image/jpeg,image/png,image/gif,image/webp
app.upload.max-file-size=5MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
