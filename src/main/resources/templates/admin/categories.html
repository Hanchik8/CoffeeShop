<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin – Categories</title>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

  <style>
    body{
      font-family:Inter,Arial;
      margin:0;
      background:#ece8e2;
      color:#2d2d2d;
    }

    .wrap{
      max-width:1100px;
      margin:40px auto;
      padding:32px 40px;
      background:#ffffff;
      border-radius:18px;
      box-shadow:0 12px 32px rgba(0,0,0,0.08);
      border:1px solid #e5ddd4;
    }

    .nav{
      display:flex;
      gap:18px;
      align-items:center;
      margin-bottom:24px;
      padding-bottom:18px;
      border-bottom:1px solid #e5e1dc;
    }
    .nav a{
      color:#8c5a3a;
      font-weight:700;
      text-decoration:none;
      font-size:15px;
      padding:6px 10px;
      border-radius:6px;
      transition:0.2s;
    }
    .nav a:hover{
      background:#f3eee8;
    }
    .nav form{ margin-left:auto }

    h1{
      margin:0 0 22px;
      font-size:26px;
      letter-spacing:0.5px;
      color:#4a3629;
      font-weight:800;
    }

    .form-inline{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:22px;
      background:#faf7f3;
      padding:16px;
      border-radius:12px;
      border:1px solid #e8e2dc;
      align-items:center;
    }

    input, select{
      padding:10px 12px;
      border:1px solid #d3cbc4;
      border-radius:8px;
      font-size:14px;
      background:#ffffff;
      transition:0.2s;
    }
    input:focus, select:focus{
      border-color:#8c5a3a;
      outline:none;
      box-shadow:0 0 0 2px rgba(140,90,58,0.25);
    }

    /* Button Styles */
    .btn-primary {
      background: linear-gradient(135deg, #8c5a3a 0%, #6b4530 100%);
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      border: 0;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(140, 90, 58, 0.3);
      font-size: 14px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(140, 90, 58, 0.4);
    }
    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-danger {
      background: linear-gradient(135deg, #e05252 0%, #c73e3e 100%);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      border: 0;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(224, 82, 82, 0.25);
      font-size: 13px;
    }
    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(224, 82, 82, 0.35);
    }
    .btn-danger:active {
      transform: translateY(0);
    }

    .btn-logout {
      background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
      color: #fff;
      border: 0;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(107, 114, 128, 0.3);
    }
    .btn-logout:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(107, 114, 128, 0.4);
    }

    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0 10px;
      margin-top:12px;
    }

    thead th{
      font-size:14px;
      text-transform:uppercase;
      letter-spacing:0.6px;
      color:#6d6158;
      padding-bottom:10px;
      text-align:left;
    }

    tbody tr{
      background:#ffffff;
      box-shadow:0 4px 14px rgba(0,0,0,0.06);
      border-radius:12px;
      overflow:hidden;
    }

    td{
      padding:14px 16px;
      font-size:15px;
      border-bottom:1px solid #f0ece8;
    }

    tbody tr:last-child td { border-bottom:none }

    img{
      height:60px;
      width:60px;
      object-fit:cover;
      border-radius:10px;
      border:1px solid #eee2d8;
    }

    .small{
      margin-top:20px;
      font-size:13px;
      color:#7a736e;
      background:#faf7f3;
      padding:10px 12px;
      border-radius:8px;
      border:1px solid #e8e2dc;
    }

    .error-banner{
      display:none;
      margin:16px 0;
      padding:10px 12px;
      border-radius:10px;
      background:#ffe6e6;
      color:#7d1b1b;
      border:1px solid #f3b8b8;
      font-weight:600;
    }
    .error-banner.show{ display:block }
  </style>
</head>

<body>
<div class="wrap">

  <div class="nav">
    <a th:href="@{/admin/categories}">Категории</a>
    <a th:href="@{/admin/items}">Позиции</a>
    <a th:href="@{/}">На сайт</a>

    <form th:action="@{/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn-logout">Выйти</button>
    </form>
  </div>

  <div id="adminError" class="error-banner" role="alert"></div>

  <h1>Категории</h1>

  <form action="/admin/categories/add" method="post" enctype="multipart/form-data" class="form-inline" data-admin-form="category">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="text" name="name" placeholder="Название" required>
    <select name="language">
      <option value="ru">ru</option>
      <option value="en">en</option>
    </select>
    <input type="file" name="image" accept="image/*">
    <button type="submit" class="btn-primary">Добавить</button>
  </form>

  <table>
    <thead>
    <tr><th>ID</th><th>Название</th><th>Язык</th><th>Изображение</th><th>Действие</th></tr>
    </thead>

    <tbody id="categoryList">
    <tr th:each="c : ${categories}">
      <td th:text="${c.id}"></td>
      <td th:text="${c.name}"></td>
      <td th:text="${c.language}"></td>
      <td>
        <img th:if="${c.imageFilename} != null" th:src="@{'/api/image/category/' + ${c.id}}">
      </td>
      <td>
        <form th:action="@{'/admin/categories/' + ${c.id} + '/delete'}" method="post" style="display:inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn-danger" data-action="delete-category" th:data-id="${c.id}">Удалить</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <div class="small">
    Примечание: изображения сохраняются в директорию uploads (сразу после перехода из корня проекта)
  </div>

</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
