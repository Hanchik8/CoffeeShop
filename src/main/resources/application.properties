spring.application.name=CoffeeShop
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/coffeeshop_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

spring.thymeleaf.cache=false

admin.username=${ADMIN_USER:admin}
admin.password=${ADMIN_PASS:admin123}

file.upload-dir=${FILE_UPLOAD_DIR:uploads}
app.upload.allowed-content-types=${APP_UPLOAD_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/gif,image/webp}
app.upload.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:50MB}

spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_REQUEST_SIZE:60MB}
server.tomcat.max-swallow-size=-1

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

logging.level.org.example.coffeeshop=${LOG_LEVEL:INFO}
